# Imagen de Remark42 para materiaroja.com: v1.18.0 con la web de usuario (feature/user-website).
# Sólo en esta rama del fork; no forma parte de la propuesta a Remark42.
name: materiaroja image

on:
  push:
    branches: [materiaroja/v1.18.0-website]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            CI=true
            GITHUB_REF=refs/tags/v1.18.0-website
            GITHUB_SHA=${{ github.sha }}
            SKIP_BACKEND_TEST=true
            SKIP_FRONTEND_TEST=true
          tags: |
            ghcr.io/davidgnavas/remark42:v1.18.0-website
            ghcr.io/davidgnavas/remark42:v1.18.0-website-${{ github.run_number }}
